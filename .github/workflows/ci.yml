name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Backend
        run: |
          npm -w backend run typecheck
          npm -w backend test
          npm -w backend run build
      - name: Frontend
        run: |
          npm -w frontend run typecheck
          npm -w frontend test
          npm -w frontend run build
